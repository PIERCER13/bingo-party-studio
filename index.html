<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="piercer" />
  <title>Piercer Bingo Party Studio</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar no-print">
    <div>
      <h1>Piercer Bingo Party Studio</h1>
      <p class="subtitle">Globo sorteador (75/90 bolas) com narração por voz e gerador de cartelas imprimíveis (A4 / PDF)</p>
    </div>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="caller">Globo Sorteador</button>
      <button type="button" class="tab" data-tab="cards">Gerador de Cartelas</button>
    </div>
  </header>

  <main id="panelCaller" class="layout no-print">
    <section class="card caller-box">
      <div class="row-2" style="width:100%;">
        <div class="field">
          <label>Modo do Bingo</label>
          <select id="bingoMode">
            <option value="75">Tradicional (75 Bolas • B-I-N-G-O)</option>
            <option value="90">Europeu (90 Bolas)</option>
          </select>
        </div>
        <div class="field">
          <label>Auto-Sorteio (seg)</label>
          <input type="number" id="autoSec" value="5" min="2" max="60" />
        </div>
      </div>

      <div class="ball-stage" id="currentBall">-</div>
      <div id="recentBalls" class="recent-balls"></div>

      <label class="check"><input type="checkbox" id="ttsBingo" checked /> Narrar bola sorteada por voz (TTS)</label>

      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnDrawBall">Sortear Bola</button>
        <button type="button" class="btn" id="btnAutoBall">Iniciar Auto</button>
        <button type="button" class="btn" id="btnResetBingo">Reiniciar Globo</button>
      </div>
    </section>

    <section class="card">
      <div class="head-row">
        <h2>Painel de Bolas Sorteadas</h2>
        <span class="subtitle" id="drawnCount">0 / 75</span>
      </div>
      <div id="ballBoard" class="ball-board"></div>
    </section>
  </main>

  <main id="panelCards" class="cards-layout hidden">
    <section class="card no-print">
      <h2>Gerar Cartelas para Impressão / PDF</h2>
      <div class="row-3">
        <div class="field">
          <label>Tipo de Cartela</label>
          <select id="cardType">
            <option value="classic">Clássica (Números 1–75)</option>
            <option value="custom">Bingo de Palavras / Live (5×5)</option>
          </select>
        </div>
        <div class="field">
          <label>Quantidade de Cartelas</label>
          <input type="number" id="cardQty" value="6" min="1" max="40" />
        </div>
        <div class="field">
          <label>Título da Cartela</label>
          <input type="text" id="cardTitle" value="BINGO DO PIERCER" />
        </div>
      </div>
      <div id="customWordsWrap" class="field hidden">
        <label>Frases / Eventos (mínimo 24 linhas para preencher 5×5 com centro LIVRE)</label>
        <textarea id="customWords" rows="4" placeholder="Streamer morreu&#10;Chat spammou F&#10;Sub novo&#10;..."></textarea>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnGenCards">Gerar Cartelas</button>
        <button type="button" class="btn" id="btnPrintCards">Imprimir / Salvar PDF (A4)</button>
      </div>
    </section>

    <section id="cardsSheet" class="cards-sheet"></section>
  </main>

  <script src="./app.js"></script>
  <script src='./piercer_i18n.js'></script>
</body>
</html>
